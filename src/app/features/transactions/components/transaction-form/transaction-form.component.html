<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="card space-y-5">
  <div class="flex items-start gap-3">
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-emerald-700">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </span>
    <div>
      <h2 class="text-base font-bold text-slate-900">Nova transação</h2>
      <p class="mt-1 text-sm text-slate-500">Processe um pagamento com segurança.</p>
    </div>
  </div>

  <div>
    <label for="accountId" class="mb-1.5 block text-sm font-medium text-slate-700">ID da conta</label>
    <input id="accountId" name="accountId" class="input" placeholder="Ex.: ACC-123"
           [(ngModel)]="model.accountId" #acc="ngModel" required
           [class.input-error]="acc.invalid && acc.touched" />
    @if (acc.invalid && acc.touched) {
      <p class="mt-1.5 text-xs text-rose-600">Informe o ID da conta.</p>
    }
  </div>

  <div>
    <label for="amount" class="mb-1.5 block text-sm font-medium text-slate-700">Valor do pagamento</label>
    <div class="relative">
      <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-sm font-medium text-slate-400">R$</span>
      <input id="amount" name="amount" type="number" step="0.01" min="0.01" class="input pl-10" placeholder="0,00"
             [(ngModel)]="model.amount" #amt="ngModel" required
             [class.input-error]="amt.touched && amountInvalid" />
    </div>
    @if (amt.touched && amountInvalid) {
      <p class="mt-1.5 text-xs text-rose-600">O valor deve ser maior que zero.</p>
    }
  </div>

  <button type="submit" class="btn-primary" [disabled]="loading">
    @if (loading) {
      <svg class="mr-2 h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" class="opacity-25"/>
        <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="opacity-90"/>
      </svg>
    }
    {{ loading ? 'Processando pagamento...' : 'Processar pagamento' }}
  </button>
  <p class="flex items-center justify-center gap-1.5 text-xs text-slate-400">
    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/>
      <path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    Processamento protegido
  </p>
</form>
